{% extends "base.html" %}{% block title %}Network{% endblock %}{% block heading %}Network Signals{% endblock %}
{% block content %}<div class="intro"><div><small>BROWSER NETWORK API</small><h1>Network Signals</h1><p>Only browser-visible and server-visible request information.</p></div><button class="primary" onclick="scan()">SCAN & SAVE</button></div><div id="net" class="cards"></div>{% endblock %}
{% block scripts %}<script>
async function scan(){let c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;let b=await (await fetch('/api/browser-info')).json();let d={module:'network',online:navigator.onLine,connection_type:c?.type||'Unavailable',effective_type:c?.effectiveType||'Unavailable',downlink_mbps:c?.downlink??null,rtt_ms:c?.rtt??null,save_data:c?.saveData??null,server_remote_address:b.remote_address,user_agent:b.user_agent,accept_language:b.language};net.innerHTML=Object.entries(d).filter(x=>x[0]!=='module').map(x=>`<div class="card"><small>${x[0].replaceAll('_',' ')}</small><b>${x[1]??'Unavailable'}</b></div>`).join('');await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});toast('Network session saved')}scan()
</script>{% endblock %}
