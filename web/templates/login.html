<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dread Core — Login</title><link rel="stylesheet" href="{{url_for('static',filename='css/dread.css')}}"></head>
<body class="login"><div class="grid"></div><form class="login-card" method="post"><div class="logo big">D</div><small>PRIVATE SECURITY LAB</small><h1>DREAD <em>CORE</em></h1><p>Advanced browser security console</p>{% if error %}<div class="error">{{error}}</div>{% endif %}<label>USERNAME</label><input name="username" required autocomplete="username"><label>PASSWORD</label><div class="pw"><input id="pw" type="password" name="password" required autocomplete="current-password"><button type="button" onclick="showPw()">SHOW</button></div><button class="primary full">ENTER CONTROL CORE</button><div class="meta">● 127.0.0.1:8080 <span>LOCAL ONLY</span></div></form><script>function showPw(){let x=document.getElementById('pw');x.type=x.type==='password'?'text':'password'}</script></body></html>
